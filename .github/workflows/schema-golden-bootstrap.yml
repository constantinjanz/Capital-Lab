name: Schema Golden Bootstrap Candidate

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Exact clean PR commit to build from
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: schema-golden-bootstrap-${{ inputs.expected_commit_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  build-independent-candidate:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == true && github.head_ref == 'codex/activation-readiness-follow-up')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.expected_commit_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact clean reviewed commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_commit_sha || github.event.pull_request.head.sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.x
      - name: Install PostgreSQL 17 client tools
        run: |
          key_file="$RUNNER_TEMP/postgresql-pgdg.asc"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc --output "$key_file"
          key_fingerprint="$(gpg --batch --show-keys --with-colons "$key_file" | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$key_fingerprint" = "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          sudo gpg --batch --dearmor --yes \
            --output /usr/share/keyrings/postgresql-pgdg.gpg "$key_file"
          echo "deb [signed-by=/usr/share/keyrings/postgresql-pgdg.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/postgresql-pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.113.0
      - name: Build PRE and POST twice from fresh Reference clusters
        env:
          CAPITAL_LAB_CI_COMMIT_SHA: ${{ inputs.expected_commit_sha || github.event.pull_request.head.sha }}
          EXPECTED_SHA: ${{ inputs.expected_commit_sha || github.event.pull_request.head.sha }}
        run: |
          mkdir -p .ci-evidence
          candidate="$RUNNER_TEMP/schema-golden-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_id="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/run-ci-gate.mjs --id schema-golden-bootstrap -- \
            node scripts/bootstrap-schema-goldens.mjs \
            "--confirm=BUILD REVIEWED SEED FREE SCHEMA GOLDENS" \
            "--expected-commit-sha=${EXPECTED_SHA}" \
            "--output-dir=${candidate}" \
            "--run-id=${run_id}"
          node scripts/verify-schema-golden-candidate-artifact.mjs \
            "--directory=${candidate}" \
            "--expected-commit-sha=${EXPECTED_SHA}"
          echo "CAPITAL_LAB_GOLDEN_CANDIDATE=${candidate}" >> "$GITHUB_ENV"
      - name: Upload short-lived row-free candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: schema-golden-candidate-${{ inputs.expected_commit_sha || github.event.pull_request.head.sha }}
          path: ${{ env.CAPITAL_LAB_GOLDEN_CANDIDATE }}
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 1
      - name: Upload redacted bootstrap evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: schema-golden-bootstrap-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
